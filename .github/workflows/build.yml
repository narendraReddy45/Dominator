# Shared build job. Called by ci.yml (every PR/master push) and release.yml
# (every tag push), so both pipelines run identical build logic -- never two
# YAML copies that can silently drift apart.
#
# Linux is the gate: it runs tests and builds servers + clients. Darwin
# clients are cross-compiled here too (no macOS runner needed), and any
# failure blocks CI and release alike.
name: Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # full history for git describe

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate build info
        run: make generate # //go:embed needs BUILD_INFO before go test/go build

      - name: Run tests
        run: make test

      - name: Build & package linux
        run: .github/scripts/release/run.sh build-linux

      - name: Build & package darwin
        run: .github/scripts/release/run.sh build-darwin

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref_type == 'tag' # only release.yml's publish job consumes this
        with:
          name: dominator-build
          path: dist/
          if-no-files-found: error
