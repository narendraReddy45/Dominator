# Release pipeline. Fires on version tags; `build` is the same job ci.yml runs
# on every PR, so a tag ships only what PRs validated.
#
# Variables (Settings -> Variables -> Actions):
#   PUBLISH_TARGETS  -- comma-separated destinations, e.g. "github,jfrog"
#   JFROG_REPO       -- required if publishing to jfrog
# Secrets: JF_URL, JF_ACCESS_TOKEN (required if publishing to jfrog)
name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      publish_targets:
        description: 'Comma-separated destinations (e.g. github,jfrog); blank = use PUBLISH_TARGETS repo var'
        type: string
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never cancel a release build mid-flight

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  # ref_type == 'tag' guards workflow_dispatch against an accidental branch run.
  publish:
    needs: build
    if: (vars.PUBLISH_TARGETS != '' || inputs.publish_targets != '') && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release  # waits for manual approval; add reviewers to this environment
    env:
      VERSION: ${{ github.ref_name }}
    permissions:
      contents: write
      id-token: write      # both required by attest-build-provenance's Sigstore signing
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dominator-build
          path: dist

      - name: Stamp version into filenames
        run: .github/scripts/release/run.sh stamp-version

      - name: Checksums
        run: .github/scripts/release/run.sh checksums

      # One glob: combined patterns can silently drop matches (attest-build-provenance#133).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/**/*'

      - name: Publish to GitHub Release
        if: contains(inputs.publish_targets || vars.PUBLISH_TARGETS, 'github')
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release/run.sh publish-github

      - name: Setup JFrog CLI
        if: contains(inputs.publish_targets || vars.PUBLISH_TARGETS, 'jfrog')
        uses: jfrog/setup-jfrog-cli@5a4fbe1e30dbb570cc62d2513421c4b9bc3c9959 # v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Publish to JFrog Artifactory
        if: contains(inputs.publish_targets || vars.PUBLISH_TARGETS, 'jfrog')
        env:
          JFROG_REPO: ${{ vars.JFROG_REPO }}
        run: .github/scripts/release/run.sh publish-jfrog
